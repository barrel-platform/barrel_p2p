name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ['29']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.0'

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-unit-otp-${{ matrix.otp }}-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-unit-otp-${{ matrix.otp }}-

      - name: Start epmd
        run: epmd -daemon

      - name: Compile
        run: rebar3 compile

      - name: EUnit
        run: rebar3 eunit

  ct:
    name: Common Test OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ['29']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.0'

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-ct-otp-${{ matrix.otp }}-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-ct-otp-${{ matrix.otp }}-

      - name: Drop stale project build (keep cached deps)
        # The cache key tracks only rebar.lock/rebar.config, so a deleted
        # source (e.g. a removed _SUITE) leaves an orphan .beam in the
        # cached _build that CT would still try to run. Rebuild just our
        # app and its test suites each run; cached deps are untouched.
        run: rm -rf _build/default/lib/barrel_p2p _build/test/lib/barrel_p2p

      - name: Start epmd
        run: epmd -daemon

      - name: Compile
        run: rebar3 compile

      - name: Common Test
        # The multi-node e2e suites are timing-sensitive under CI load; a
        # different case occasionally flakes per run. Retry the full suite
        # up to 3 times (rebar3 ct --retry mis-resolves suite paths here).
        # A deterministic failure still fails on every attempt.
        run: |
          for attempt in 1 2 3; do
            if rebar3 ct; then exit 0; fi
            echo "::warning::CT attempt ${attempt} failed; retrying"
          done
          exit 1

      - name: Upload CT logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs-otp${{ matrix.otp }}
          path: _build/test/logs
          retention-days: 7

  xref:
    name: XRef
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27.0'
      - name: XRef
        run: rebar3 xref

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27.0'
      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: |
            _build/*_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-plt-otp29-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp29-
      - name: Dialyzer
        run: rebar3 dialyzer

  format:
    name: erlfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27.0'
      - name: Check formatting
        run: rebar3 fmt --check

  lint:
    name: Elvis lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27.0'
      - name: Elvis lint
        run: rebar3 lint

  tla:
    name: TLA+ model check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache tla2tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/barrel_p2p/tla
          key: tla2tools-${{ hashFiles('spec/tla/check.sh') }}
      - name: Model check
        run: spec/tla/check.sh

  tamarin:
    name: Tamarin protocol proofs
    runs-on: ubuntu-24.04
    env:
      TAMARIN_VERSION: '1.12.0'
      TAMARIN_SHA256: 201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6
      MAUDE_VERSION: '3.5.1'
      MAUDE_SHA256: 72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c
    steps:
      - uses: actions/checkout@v4
      - name: Install Tamarin and Maude
        run: |
          mkdir -p "$HOME/tamarin" && cd "$HOME/tamarin"
          curl -fsSL -o tamarin.tar.gz \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/$TAMARIN_VERSION/tamarin-prover-$TAMARIN_VERSION-linux64-ubuntu.tar.gz"
          curl -fsSL -o maude.zip \
            "https://github.com/maude-lang/Maude/releases/download/Maude$MAUDE_VERSION/Maude-$MAUDE_VERSION-linux-x86_64.zip"
          echo "$TAMARIN_SHA256  tamarin.tar.gz" | sha256sum -c -
          echo "$MAUDE_SHA256  maude.zip" | sha256sum -c -
          tar xzf tamarin.tar.gz
          unzip -q maude.zip
          chmod +x tamarin-prover maude
          echo "$HOME/tamarin" >> "$GITHUB_PATH"
      - name: Prove
        run: spec/tamarin/check.sh

  bench:
    name: Bench vs baseline
    runs-on: ubuntu-24.04
    # Soft gate (kept as a safety net): a rare same-runner noise spike
    # should not block merge. The comparison below benchmarks the PR head
    # and the base commit on the SAME runner, so hardware variance cancels
    # and the threshold catches a genuine regression. The committed
    # bench/baseline.json is for local use only; it is machine-specific
    # and not comparable across runners.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so the base commit can be checked out for the
          # same-runner comparison.
          fetch-depth: 0

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27.0'

      - name: Start epmd
        run: epmd -daemon

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Bench PR head
        run: ./bench/run.sh 1000

      - name: Bench base commit on the same runner
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD^)"; fi
          echo "Benchmarking base $BASE on this runner"
          git worktree add --detach /tmp/bench-base "$BASE"
          ( cd /tmp/bench-base && ./bench/run.sh 1000 )
          cp /tmp/bench-base/bench/results.json bench/base-results.json

      - name: Compare PR vs base (same hardware)
        run: ./bench/compare.sh 30 bench/results.json bench/base-results.json

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench/results.json
            bench/base-results.json
          retention-days: 14
