\* Registry/leader, double stamp only. Expected to FAIL QuiescentConverged.
CONSTANTS
    Nodes = {1, 2, 3}
    Keys = {"k"}
    Values = {"a"}
    MaxClock = 3
    MaxWrites = 3
    MaxFlips = 2
    SingleWriter = TRUE
    OwnOnlySnapshot = TRUE
    PruneMode = "owner"
    SelfMerge = FALSE
    AE = FALSE
    SingleStamp = FALSE
    GC = FALSE
    GcSafe = TRUE
    SendTombstones = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoResurrection
    QuiescentConverged
    WriterIntentKept

CHECK_DEADLOCK FALSE
