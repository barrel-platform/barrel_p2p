\* Plumtree as coded: any GOSSIP/GRAFT sender becomes eager. Expected to FAIL EagerInView.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Origin = 1
    Links = {{1, 2}, {2, 3}, {3, 4}, {4, 1}, {1, 3}}
    MaxFaults = 2
    FixAnnouncers = TRUE
    FixEagerInView = FALSE
    FixReliableSend = TRUE

SPECIFICATION Spec

INVARIANTS
    DeliveredAtQuiescence
    EagerInView

CHECK_DEADLOCK FALSE
