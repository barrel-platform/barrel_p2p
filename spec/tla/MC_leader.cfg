\* Leader election: one writer per key, snapshot of all candidates, prune by key owner, own deltas merged, no anti-entropy. Must pass.
CONSTANTS
    Nodes = {1, 2, 3}
    Keys = {"k"}
    Values = {"a"}
    MaxClock = 3
    MaxWrites = 3
    MaxFlips = 2
    SingleWriter = TRUE
    OwnOnlySnapshot = FALSE
    PruneMode = "owner"
    SelfMerge = TRUE
    AE = FALSE
    SingleStamp = TRUE
    GC = FALSE
    GcSafe = TRUE
    SendTombstones = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoResurrection
    QuiescentConverged
    WriterIntentKept

CHECK_DEADLOCK FALSE
