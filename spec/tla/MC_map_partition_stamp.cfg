\* barrel_p2p_map (multi-writer, anti-entropy, no prune), double stamp only. Single value, two link failures (full partition).
CONSTANTS
    Nodes = {1, 2, 3}
    Keys = {"k"}
    Values = {"a"}
    MaxClock = 2
    MaxWrites = 2
    MaxFlips = 2
    SingleWriter = FALSE
    OwnOnlySnapshot = FALSE
    PruneMode = "none"
    AE = TRUE
    SingleStamp = FALSE
    SendTombstones = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoResurrection
    QuiescentConverged
    WriterIntentKept

CHECK_DEADLOCK FALSE
