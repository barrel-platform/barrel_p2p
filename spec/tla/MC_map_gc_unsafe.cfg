\* barrel_p2p_map with tombstone GC that drops too early (a TTL shorter than a partition). Expected to FAIL NoResurrection.
CONSTANTS
    Nodes = {1, 2, 3}
    Keys = {"k"}
    Values = {"a"}
    MaxClock = 2
    MaxWrites = 2
    MaxFlips = 2
    SingleWriter = FALSE
    OwnOnlySnapshot = FALSE
    PruneMode = "none"
    SelfMerge = TRUE
    AE = TRUE
    SingleStamp = TRUE
    GC = TRUE
    GcSafe = FALSE
    SendTombstones = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoResurrection
    QuiescentConverged
    WriterIntentKept

CHECK_DEADLOCK FALSE
